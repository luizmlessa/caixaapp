spring:
  application:
    name: caixaapp
  datasource:
    url: jdbc:postgresql://localhost:5432/caixaapp
    username: admin
    password: 123
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.luiz.caixaapp: DEBUG